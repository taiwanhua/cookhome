name: CI

on:
  pull_request:
  push:
    branches: [main, dev, staging]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # 版本讀 package.json 的 packageManager 欄位

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝依賴
        run: pnpm install --frozen-lockfile

      - name: 建置 api(front 的 ISR 預渲染需要活的 api)
        run: pnpm exec turbo run build --filter=@repo/api

      - name: 啟動 api(接 CI 的拋棄式 MongoDB,空資料庫)
        run: |
          node apps/api/dist/main.js &
          timeout 60 bash -c 'until curl -sf -X POST -H "Content-Type: application/json" -d "{\"query\":\"{__typename}\"}" http://127.0.0.1:5001/graphql -o /dev/null; do sleep 2; done'
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/cookhome
          PORT: "5001"
          # api 缺少 JWT_SECRET 即啟動失敗(#62);CI 只需一個假值讓 front 預渲染能打到 api
          JWT_SECRET: ci-only-jwt-secret

      # check-types 與 build 分兩步:next build 會清寫 .next,與 next typegen 同時跑會競態
      # MONGODB_URI:db-migrator 測試沿用本 job 的 MongoDB service container(本地無此變數時自起 mongodb-memory-server)
      - name: lint / typecheck / test
        run: pnpm exec turbo run lint check-types test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/cookhome

      - name: build
        run: pnpm exec turbo run build
        env:
          NEXT_PUBLIC_GRAPHQL_ENDPOINT: http://127.0.0.1:5001/graphql
