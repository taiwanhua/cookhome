name: Deploy

# 部署一律手動觸發(merge 不會自動部署):
#   UI :GitHub → Actions → Deploy → Run workflow →「Use workflow from」選分支 + environment 選環境
#   CLI:gh workflow run Deploy --ref dev -f environment=dev
#        gh workflow run Deploy --ref staging -f environment=staging
#        gh workflow run Deploy --ref main -f environment=production
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "部署目標(分支需對應:dev→dev、staging→staging、production→main)"
        required: true
        type: choice
        options: [dev, staging, production]

permissions:
  contents: read
  id-token: write # Workload Identity Federation 免金鑰認證

env:
  REGION: asia-east1
  REGISTRY: asia-east1-docker.pkg.dev/cookhome-online/cookhome

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 分支 ↔ 環境防呆
        run: |
          case "${{ inputs.environment }}" in
            dev)        EXPECT=dev ;;
            staging)    EXPECT=staging ;;
            production) EXPECT=main ;;
          esac
          if [ "$GITHUB_REF_NAME" != "$EXPECT" ]; then
            echo "::error::environment=${{ inputs.environment }} 必須從分支 $EXPECT 觸發(目前分支:$GITHUB_REF_NAME)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: 環境參數
        id: cfg
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          case "${{ inputs.environment }}" in
            dev)
              echo "suffix=-dev" >> "$GITHUB_OUTPUT"
              echo "secret=mongodb-uri-dev" >> "$GITHUB_OUTPUT"
              echo "enc_secret=field-encryption-key-dev" >> "$GITHUB_OUTPUT"
              echo "root_secret=root-admin-password-dev" >> "$GITHUB_OUTPUT"
              echo "sandbox=true" >> "$GITHUB_OUTPUT"
              echo "api_url=https://api-dev.cookhome.online" >> "$GITHUB_OUTPUT"
              ;;
            staging)
              echo "suffix=-staging" >> "$GITHUB_OUTPUT"
              echo "secret=mongodb-uri-staging" >> "$GITHUB_OUTPUT"
              echo "enc_secret=field-encryption-key-staging" >> "$GITHUB_OUTPUT"
              echo "root_secret=root-admin-password-staging" >> "$GITHUB_OUTPUT"
              echo "sandbox=false" >> "$GITHUB_OUTPUT"
              echo "api_url=https://api-staging.cookhome.online" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "suffix=" >> "$GITHUB_OUTPUT"
              echo "secret=mongodb-uri" >> "$GITHUB_OUTPUT"
              echo "enc_secret=field-encryption-key" >> "$GITHUB_OUTPUT"
              echo "root_secret=root-admin-password" >> "$GITHUB_OUTPUT"
              echo "sandbox=false" >> "$GITHUB_OUTPUT"
              echo "api_url=https://api.cookhome.online" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/728045896207/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: github-deployer@cookhome-online.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      # image tag = 分支 HEAD 的 git SHA;admin 是 Vite,VITE_* build 時烘入 → 每環境各一顆
      - name: build + push
        run: |
          docker build -f apps/api/Dockerfile -t $REGISTRY/api:${{ steps.cfg.outputs.sha }} .
          docker build -f apps/admin/Dockerfile \
            -t $REGISTRY/admin:${{ steps.cfg.outputs.sha }}${{ steps.cfg.outputs.suffix }} \
            --build-arg VITE_GRAPHQL_ENDPOINT=${{ steps.cfg.outputs.api_url }}/graphql .
          docker push $REGISTRY/api:${{ steps.cfg.outputs.sha }}
          docker push $REGISTRY/admin:${{ steps.cfg.outputs.sha }}${{ steps.cfg.outputs.suffix }}

      - name: deploy
        run: |
          if [ "${{ steps.cfg.outputs.sandbox }}" = "true" ]; then
            SANDBOX_ARGS="--update-env-vars=GRAPHQL_SANDBOX=true"
          else
            SANDBOX_ARGS="--remove-env-vars=GRAPHQL_SANDBOX"
          fi
          gcloud run deploy cookhome-api${{ steps.cfg.outputs.suffix }} --region=$REGION \
            --image=$REGISTRY/api:${{ steps.cfg.outputs.sha }} \
            --port=5001 --allow-unauthenticated --min-instances=0 --max-instances=2 \
            --set-secrets=MONGODB_URI=${{ steps.cfg.outputs.secret }}:latest,FIELD_ENCRYPTION_KEY=${{ steps.cfg.outputs.enc_secret }}:latest \
            $SANDBOX_ARGS --quiet
          gcloud run deploy cookhome-admin${{ steps.cfg.outputs.suffix }} --region=$REGION \
            --image=$REGISTRY/admin:${{ steps.cfg.outputs.sha }}${{ steps.cfg.outputs.suffix }} \
            --port=8080 --allow-unauthenticated --min-instances=0 --max-instances=2 --quiet

      # 部署成功後對該環境資料庫跑「遷移 → 種子」(ADR-0002:CI runner 直連,不放 server 啟動)。
      # 只裝 db-migrator 及其依賴;MONGOMS_DISABLE_POSTINSTALL 避免下載測試用的 mongod 二進位檔。
      - uses: pnpm/action-setup@v4 # 版本讀 package.json 的 packageManager 欄位

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安裝 db-migrator 依賴
        run: pnpm install --frozen-lockfile --filter @repo/db-migrator...
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"

      - name: migrate → seed
        env:
          ROOT_ADMIN_ACCOUNT: root
          ROOT_ADMIN_EMAIL: a0987837233@gmail.com
        run: |
          MONGODB_URI=$(gcloud secrets versions access latest --secret=${{ steps.cfg.outputs.secret }})
          ROOT_ADMIN_PASSWORD=$(gcloud secrets versions access latest --secret=${{ steps.cfg.outputs.root_secret }})
          echo "::add-mask::$MONGODB_URI"
          echo "::add-mask::$ROOT_ADMIN_PASSWORD"
          export MONGODB_URI ROOT_ADMIN_PASSWORD
          pnpm --filter @repo/db-migrator migrate
          pnpm --filter @repo/db-migrator seed
