name: Reset DB

# 驗收重測用的資料庫還原(正本:ADR-0002「還原(reset)」;用法與限制見 docs/deployment.md)。
# 一律手動觸發:
#   UI :GitHub → Actions → Reset DB → Run workflow → 選 environment 與 mode
#   CLI:gh workflow run "Reset DB" --ref dev -f environment=dev -f mode=data
#
# **沒有 production 選項**:reset 永不對 production 執行。指令端另有三道安全閥
#(apps/db-migrator/src/reset/reset-safety.ts),就算這裡被改壞也擋得住。
#
# 雲端目標、Secret 名稱與 seed 帳號不寫在本檔:與 deploy.yml 同一份正本(deploy/project/*.json),
# 由「專案設定」步驟讀取並驗證;設定值一律經 step 的 env 傳給腳本,不內插進 run 的程式文本。
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "還原目標(只有 dev / staging;production 不開放)"
        required: true
        type: choice
        options: [dev, staging]
      mode:
        description: "data=只刪人建的資料再補 seed(模組開關 / 圖示保留);full=整庫重建(dropDatabase → migrate → seed)"
        required: true
        type: choice
        options: [data, full]

permissions:
  contents: read
  id-token: write # Workload Identity Federation 免金鑰認證

jobs:
  reset:
    runs-on: ubuntu-latest
    # 用 GitHub environment 包起來,日後要加人工審核直接在該 environment 上設 required reviewers
    environment: ${{ inputs.environment }}
    steps:
      # 專案設定檔三個環境都有(deploy 要用),所以「reset 沒有 production」不能靠設定檔缺值來擋,在讀設定前先擋一次
      - name: 環境防呆(只允許 dev / staging)
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$ENVIRONMENT" in
            dev | staging) ;;
            *)
              echo "::error::reset 只允許 dev / staging,production 永不執行"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4

      # 與 deploy.yml 同一個讀取器:repository 與設定檔的 expectedRepository 不符或缺值時在這裡失敗,不會進到雲端認證
      - name: 專案設定(核對 repo 與環境)
        id: cfg
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/project-settings/read-config.mjs --scope cloud --environment "$ENVIRONMENT" --repository "$REPOSITORY" > "$RUNNER_TEMP/project-cloud.json"
          node scripts/project-settings/write-github-output.mjs --scope cloud < "$RUNNER_TEMP/project-cloud.json"

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ steps.cfg.outputs.gcp_project_id }}
          workload_identity_provider: ${{ steps.cfg.outputs.wif_provider }}
          service_account: ${{ steps.cfg.outputs.deployer_sa }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: pnpm/action-setup@v4 # 版本讀 package.json 的 packageManager 欄位

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # 只裝 db-migrator 及其依賴;MONGOMS_DISABLE_POSTINSTALL 避免下載測試用的 mongod 二進位檔
      - name: 安裝 db-migrator 依賴
        run: pnpm install --frozen-lockfile --filter @repo/db-migrator...
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"

      # --confirm 取自連線字串裡的資料庫名:指令會比對兩者,不符即拒絕(打錯環境就過不了)
      - name: reset
        env:
          ROOT_ADMIN_ACCOUNT: ${{ steps.cfg.outputs.root_account }}
          ROOT_ADMIN_EMAIL: ${{ steps.cfg.outputs.root_email }}
          RESET_ALLOW_ENV: ${{ inputs.environment }}
          ENVIRONMENT: ${{ inputs.environment }}
          MODE: ${{ inputs.mode }}
          MONGODB_SECRET_NAME: ${{ steps.cfg.outputs.mongodb_secret }}
          ROOT_SECRET_NAME: ${{ steps.cfg.outputs.root_secret }}
        run: |
          MONGODB_URI=$(gcloud secrets versions access latest --secret="$MONGODB_SECRET_NAME")
          ROOT_ADMIN_PASSWORD=$(gcloud secrets versions access latest --secret="$ROOT_SECRET_NAME")
          echo "::add-mask::$MONGODB_URI"
          echo "::add-mask::$ROOT_ADMIN_PASSWORD"
          export MONGODB_URI ROOT_ADMIN_PASSWORD
          DB_NAME=$(node -p "decodeURIComponent(new URL(process.env.MONGODB_URI).pathname.slice(1))")
          echo "::notice::reset --mode=$MODE --confirm=$DB_NAME(環境:$ENVIRONMENT)"
          pnpm --filter @repo/db-migrator reset --mode="$MODE" --confirm="$DB_NAME"
