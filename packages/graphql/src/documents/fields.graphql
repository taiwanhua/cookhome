# 欄位管理(#206;模組 system.field-manager,規則正本 docs/modules/field-manager.md)。
# 清單是「全域種子 + 當前組織自訂」的合併結果,每筆帶 source:
# GLOBAL = 全域種子(只能切 enabled)、OWN = 當前組織自訂(可編輯 label / order / description)。
# 「來源」欄的文案由前端依 source 組(全域 / <組織名稱> 自訂),不從 api 傳組織名(GQL-07)。

fragment FieldFields on Field {
  id
  categoryId
  label
  value
  order
  enabled
  description
  source
}

# 左側類別清單(全域種子,租戶不可自訂;新增類別走 code + PR)
query FieldCategories {
  fieldCategories {
    items {
      id
      key
      name
      description
    }
    totalCount
  }
}

# 右側選項表格;已依 order 排好
query Fields($categoryId: ID!) {
  fields(categoryId: $categoryId) {
    items {
      ...FieldFields
    }
    totalCount
  }
}

# 新增自訂選項:orgId 不由前端給(= 當前組織);
# value 與同類別下的既有選項(本組織自訂或全域)重複 → FIELD_VALUE_DUPLICATE,標在「值」欄位
mutation CreateField($input: CreateFieldInput!) {
  createField(input: $input) {
    field {
      ...FieldFields
    }
  }
}

# 編輯自訂選項;value 不可改(不在 input 內),種子選項送進來一律 FORBIDDEN。
# 缺席 / null 語意(GQL-06):label / order 缺席 = 不動;description 缺席 = 不動、null = 清空
mutation UpdateField($input: UpdateFieldInput!) {
  updateField(input: $input) {
    field {
      ...FieldFields
    }
  }
}

# 停用 / 啟用;種子選項的 enabled 是全域開關,只有根組織操作者切得動(否則 FORBIDDEN)
mutation SetFieldEnabled($input: SetFieldEnabledInput!) {
  setFieldEnabled(input: $input) {
    field {
      ...FieldFields
    }
  }
}
